<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container py-4">

        <div class="card border-0 shadow-lg rounded-lg p-3">

            <div class="text-center text-white rounded-lg p-3 mb-4"
                 style="background: linear-gradient(135deg, #667eea, #764ba2);">
                <h3 class="font-weight-bold mb-1">
                    <i class="fa-solid fa-users mr-2"></i>Employee Records
                </h3>
                <p class="mb-0">Manage Your Employee Details</p>
            </div>

            <div class="row">

                <div class="col-md-4 mb-4">
                    <div class="card border-0 shadow rounded-lg h-100">

                        <div class="card-header text-white text-center"
                             style="background: linear-gradient(135deg, #667eea, #764ba2);">
                            <h5 class="font-weight-bold mb-0">
                                <i class="fa-solid fa-user-plus mr-2"></i>Add Employee
                            </h5>
                        </div>

                        <div class="card-body p-4">
                            <form id="empForm">

                                <div class="form-group">
                                    <label for="eName" class="font-weight-bold">Employee Name</label>
                                    <input type="text" class="form-control rounded-pill" id="eName" placeholder="Enter employee name" required>
                                </div>

                                <div class="form-group">
                                    <label for="department" class="font-weight-bold">Department</label>
                                    <select class="form-control rounded-pill" id="department" required>
                                        <option value="" selected disabled>Select Department</option>
                                        <option value="Development">Development</option>
                                        <option value="Testing">Testing</option>
                                        <option value="HR">HR</option>
                                        <option value="Marketing">Marketing</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="salary" class="font-weight-bold">Salary</label>
                                    <input type="number" class="form-control rounded-pill" id="salary" placeholder="Enter salary" required>
                                </div>

                                <div class="form-group">
                                    <label for="city" class="font-weight-bold">City</label>
                                    <input type="text" class="form-control rounded-pill" id="city" placeholder="Enter city" required>
                                </div>

                                <button type="submit" class="btn btn-primary btn-block rounded-pill shadow-sm" id="submitBtn">
                                    <i class="fa-solid fa-plus mr-2"></i>Add Employee
                                </button>

                                <button type="button" class="btn btn-success btn-block rounded-pill shadow-sm d-none" id="updateBtn">
                                    <i class="fa-solid fa-pen-to-square mr-2"></i>Update Employee
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-8 mb-4">
                    <div class="card border-0 shadow rounded-lg h-100">

                        <div class="card-header text-white"
                             style="background: linear-gradient(135deg, #11998e, #38ef7d);">
                            <h5 class="font-weight-bold mb-0">
                                <i class="fa-solid fa-table-list mr-2"></i>Employee Management
                            </h5>
                        </div>

                        <div class="card-body p-3">
                            <div class="table-responsive">
                                <table class="table table-bordered table-hover text-center mb-0">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>Sr.No</th>
                                            <th>Name</th>
                                            <th>Department</th>
                                            <th>Salary</th>
                                            <th>City</th>
                                            <th>Edit</th>
                                            <th>Delete</th>
                                        </tr>
                                    </thead>

                                    <tbody id="empInfo">
                                        <!-- <tr>
                                            <td></td>
                                            <td></td>
                                            <td></td>
                                            <td></td>
                                            <td></td>
                                            <td><i class="fa-solid fa-pen-to-squarefa-2x text-primary"></i></td>
                                            <td><i class="fa-solid fa-trashfa-2x text-danger"></i></td>
                                        </tr> -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
     <div class="spinner d-none" id="spinner">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
    <script src="./assets/js/app.js"></script>

</body>
</html>
